name: Build and Deploy

on:
  push:
    branches:
      - main
      - feat/kakao-login
      - feat/user

jobs:
  # 1. build job (optional - 빌드 테스트용)
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build JAR File (Test)
        run: mvn clean package -DskipTests


  # 2. deploy job
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Load .env and export variables
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env
          source .env
          echo "SSH_HOST=$SSH_HOST" >> $GITHUB_ENV
          echo "SSH_PORT=$SSH_PORT" >> $GITHUB_ENV
          echo "SSH_USER=$SSH_USER" >> $GITHUB_ENV
          echo "$SSH_KEY_BASE64" | base64 -d > private_key
          chmod 600 private_key

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.SSH_HOST }}
          port: ${{ env.SSH_PORT }}
          username: ${{ env.SSH_USER }}
          key_path: private_key
          script: |
            echo "${{ secrets.ENV_FILE }}" > ~/app/.env

            cd ~/app || git clone https://github.com/whenwhen-project/whenwhen-BE.git ~/app && cd ~/app

            git pull origin main

            docker stop whenwhen-container || true
            docker rm whenwhen-container || true

            docker build -t whenwhen:latest .

            docker run -d \
              -p 8080:8080 \
              --name whenwhen-container \
              --env-file .env \
              whenwhen:latest

            rm -f .env
